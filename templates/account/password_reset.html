{% extends "base.html" %}
{% block title %}Восстановление пароля — VELOUR{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <a href="/" class="logo" style="display:block;margin-bottom:var(--space-xl)">VEL<span>OUR</span></a>
    <h1 class="auth-title">Восстановление пароля</h1>
    <p class="auth-subtitle">Введите email — мы отправим ссылку для сброса пароля</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="mail@example.com" required autofocus>
      </div>
      <button type="submit" class="btn btn-dark btn-block btn-lg">Отправить письмо</button>
    </form>
    <div style="text-align:center;margin-top:var(--space-lg)">
      <a href="/account/login/" style="font-size:.85rem;color:var(--color-accent)">← Вернуться ко входу</a>
    </div>
  </div>
</div>
{% endblock %}
