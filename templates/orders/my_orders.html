{% extends "base.html" %}
{% load static %}
{% block title %}Мои заказы{% endblock %}
{% block content %}
<div class="container" style="padding-top:var(--space-xl);padding-bottom:var(--space-4xl)">
  <div class="breadcrumb">
    <a href="/">Главная</a><span class="breadcrumb-sep">›</span>
    <a href="/account/profile/">Профиль</a><span class="breadcrumb-sep">›</span>
    <span>Мои заказы</span>
  </div>
  <h1 style="margin-bottom:var(--space-2xl)">Мои заказы</h1>
  <div class="card" style="overflow:auto">
    <table class="orders-table">
      <thead>
        <tr>
          <th>Номер</th><th>Дата</th><th>Статус</th><th>Позиций</th><th>Сумма</th>
        </tr>
      </thead>
      <tbody id="orders-tbody">
        <tr><td colspan="5" style="text-align:center;padding:40px"><span class="spinner" style="border-color:var(--color-border);border-top-color:var(--color-accent);width:28px;height:28px;border-width:3px"></span></td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block extra_js %}<script src="{% static 'js/account.js' %}"></script>{% endblock %}
